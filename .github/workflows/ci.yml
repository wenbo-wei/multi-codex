name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install package tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gnome-shell zip unzip
      - name: Check source
        run: make check
      - name: Build and verify package
        run: make verify
